<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
  <title id="title">AuraGuard dashboard overview preview</title>
  <desc id="desc">Illustration of the disconnected dashboard layout, showing the receiver connection panel, device cards, monitoring metrics, and recent activity area. This is a design preview, not a live device screenshot.</desc>
  <defs>
    <style>
      .text{fill:#2b322f;font-family:Arial,sans-serif}.muted{fill:#70786f;font-family:Arial,sans-serif}.accent{fill:#aa563d;font-family:Arial,sans-serif}.small{font-size:12px}.tiny{font-size:10px}.medium{font-size:17px;font-weight:600}.bold{font-weight:700}.card{fill:#fffefa;stroke:#e1e4d9;stroke-width:1.5}.rule{stroke:#e1e4d9;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1200" height="790" fill="#f5f4ef"/>
  <rect width="1200" height="78" fill="#fffefa"/>
